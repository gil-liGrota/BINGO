<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Realtime</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>

  <header class="app-header">
    <h1>Bingo Realtime</h1>
  </header>

  <main id="app">
    <!-- 1. מסך התחברות / הרשמה -->
    <section id="authSection" class="card">
      <h2>התחברות / הרשמה</h2>
      <form id="authForm" onsubmit="return false;">
        <div class="form-group">
          <input type="text" id="usernameInput" placeholder="שם משתמש / אימייל" required autocomplete="username" />
        </div>
        <div class="form-group">
          <input type="password" id="passwordInput" placeholder="סיסמה (לפחות 6 תווים)" required autocomplete="current-password" />
        </div>
        
        <p id="authError" class="error-message" style="display: none;"></p>

        <div class="buttons-group">
          <button type="button" id="loginBtn" class="btn btn-primary">התחבר</button>
          <button type="button" id="registerBtn" class="btn btn-secondary">הרשם</button>
        </div>
      </form>
    </section>

    <!-- 2. מסך ראשי / לובי (מוסתר בהתחלה) -->
    <section id="homeSection" class="card" style="display: none;">
      <h2>ברוכים הבאים לבינגו!</h2>
      <div class="home-actions">
        <button id="btnCreateRoom" class="btn btn-primary">צור חדר חדש</button>
        <button id="btnJoinRoom" class="btn btn-secondary">הצטרף לחדר</button>
        <button id="btnManageWordLists" class="btn btn-outline">ניהול רשימות מילים</button>
      </div>
    </section>

    <!-- 3. מסך חדר המתנה (RoomUI) -->
    <section id="roomSection" class="card" style="display: none;">
      <h2>חדר משחק: <span id="roomCodeDisplay"></span></h2>
      <div id="playersListContainer">
        <h3>שחקנים בחדר:</h3>
        <ul id="playersList"></ul>
      </div>
      <div id="hostControls" style="display: none;">
        <button id="btnStartGame" class="btn btn-success">התחל משחק</button>
      </div>
    </section>

    <!-- 4. מסך המשחק (GameUI) -->
    <section id="gameSection" class="card" style="display: none;">
      <div class="game-header">
        <h2 id="gameStatus">משחק פעיל</h2>
      </div>
      <div id="boardContainer" class="bingo-board"></div>
    </section>
  </main>

  <!-- טעינת האפליקציה בנתיב המדויק מתוך תיקיית js -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
